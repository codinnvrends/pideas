requirements_analysis:
  description: >
    Analyze the project idea: "{idea_description}" and user profile to create comprehensive
    technical requirements. Focus on:
    1. Project scope and objectives definition
    2. Technology stack selection based on complexity and user skill level
    3. Feature breakdown and prioritization
    4. Technical architecture recommendations
    5. Development timeline estimation
    6. Resource and dependency requirements
    
    Consider the user's experience level: {user_skill_level} and preferred technologies: {user_preferences}
  expected_output: >
    A comprehensive requirements document in JSON format containing:
    - Project overview and objectives
    - Selected technology stack with justification
    - Detailed feature list with priorities
    - Technical architecture diagram (textual description)
    - Development phases and timeline
    - Dependencies and setup requirements
  agent: requirements_analyst
  output_pydantic: RequirementsDocument

code_development:
  description: >
    Generate complete, production-ready source code for "{project_name}" based on the
    requirements specification. Create:
    1. Complete project structure with all necessary files
    2. Source code following best practices and modern patterns
    3. Configuration files (package.json, requirements.txt, etc.)
    4. Environment setup and deployment configurations
    5. Basic styling and responsive design (if applicable)
    6. Database schemas and migrations (if needed)
    7. API endpoints and routing (if applicable)
    
    Ensure code is modular, well-commented, and follows the selected technology stack patterns.
  expected_output: >
    Complete source code project with:
    - All source files organized in proper directory structure
    - Configuration and setup files
    - Basic documentation in code comments
    - Functional implementation of all specified features
    - Ready-to-run codebase
  agent: developer
  context:
    - requirements_analysis
  output_pydantic: CodebaseOutput

code_review:
  description: >
    Perform comprehensive code review of the generated codebase for "{project_name}".
    Review for:
    1. Code quality and adherence to best practices
    2. Security vulnerabilities and potential issues
    3. Performance optimization opportunities
    4. Code maintainability and readability
    5. Proper error handling and edge cases
    6. Documentation completeness
    7. Compatibility and dependency issues
    
    Provide detailed feedback and implement necessary improvements.
  expected_output: >
    Code review report with:
    - Quality assessment score and detailed analysis
    - List of identified issues with severity levels
    - Security audit findings
    - Performance recommendations
    - Improved/fixed code where necessary
    - Compliance with coding standards verification
  agent: reviewer
  context:
    - code_development
  output_pydantic: ReviewReport

test_generation:
  description: >
    Generate comprehensive test suites for "{project_name}" based on the reviewed codebase.
    Create:
    1. Unit tests for individual functions/methods
    2. Integration tests for API endpoints and components
    3. End-to-end tests for critical user workflows
    4. Test configuration and setup files
    5. Mock data and fixtures where needed
    6. Test documentation and coverage reports
    
    Ensure tests cover edge cases, error conditions, and main functionality paths.
  expected_output: >
    Complete test suite including:
    - Unit test files with comprehensive coverage
    - Integration test scenarios
    - End-to-end test workflows
    - Test configuration and setup instructions
    - Test data and mock objects
    - Testing documentation and run instructions
  agent: tester
  context:
    - code_review
  output_pydantic: TestSuiteOutput

debug_and_fix:
  description: >
    Identify and resolve any bugs, errors, or issues found in "{project_name}" during testing phase.
    Focus on:
    1. Compilation and syntax error resolution
    2. Runtime error identification and fixing
    3. Test failure analysis and resolution
    4. Performance bottleneck identification
    5. Dependency conflict resolution
    6. Cross-platform compatibility issues
    7. Final code optimization and cleanup
    
    Ensure the final codebase runs without errors and passes all tests.
  expected_output: >
    Debug report and fixed codebase containing:
    - List of identified issues with root cause analysis
    - Detailed bug fixes and resolutions implemented
    - Performance optimizations applied
    - Final working codebase with all issues resolved
    - Test results showing all tests passing
    - Deployment-ready code verification
  agent: debugger
  context:
    - test_generation
  output_pydantic: DebugReport

final_delivery:
  description: >
    Package the complete "{project_name}" project for final delivery. Create:
    1. Comprehensive README.md with project overview
    2. Detailed setup and installation instructions
    3. Deployment guide for different environments
    4. API documentation (if applicable)
    5. User guide and feature documentation
    6. Development and contribution guidelines
    7. Organized project structure with proper file organization
    8. ZIP package preparation for download
    
    Ensure the project is ready for immediate use by the end user.
  expected_output: >
    Final project package containing:
    - Complete project files in organized structure
    - Comprehensive documentation suite
    - Setup and deployment guides
    - User manuals and API documentation
    - Contributing guidelines for developers
    - ZIP file ready for download with proper naming
    - Project metadata and version information
  agent: delivery_manager
  context:
    - debug_and_fix
  output_file: "output/{project_name}_complete_project.zip"
  output_pydantic: FinalDeliverable
